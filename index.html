<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veterans 5K — Fundraising Tracker</title>
<style>
:root {
  --bg: #0a0e1a;
  --card: #131826;
  --border: #1e2433;
  --text: #e4e7ee;
  --muted: #6b7280;
  --accent: #3b82f6;
  --gold: #fbbf24;
  --green: #10b981;
  --red: #ef4444;
  --purple: #a78bfa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* Header */
.header { text-align: center; padding: 30px 20px; margin-bottom: 24px; background: linear-gradient(135deg, #0d1525, #162033); border-radius: 16px; border: 1px solid var(--border); }
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.header .subtitle { color: var(--muted); font-size: 14px; }
.flag { font-size: 32px; }

/* Total */
.total-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; margin-bottom: 24px; }
.total-card .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.total-card .amount { font-size: 48px; font-weight: 800; color: var(--green); }
.total-card .breakdown { display: flex; justify-content: center; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
.total-card .breakdown-item { text-align: center; }
.total-card .breakdown-item .num { font-size: 20px; font-weight: 700; }
.total-card .breakdown-item .lbl { color: var(--muted); font-size: 12px; }

/* Progress bar */
.progress-wrap { margin: 20px 0; }
.progress-bar { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; }
.progress-fill { background: linear-gradient(90deg, var(--green), var(--accent)); height: 100%; border-radius: 999px; transition: width 0.5s; }
.progress-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* Grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

/* Card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

/* Table */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--border); }
td { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 14px; }
td:last-child { text-align: right; }
.donor-name { font-weight: 600; }
.donor-amt { color: var(--green); font-weight: 700; }
.donor-date { color: var(--muted); font-size: 12px; }

/* Leaderboard */
.lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.lb-row:last-child { border-bottom: none; }
.lb-rank { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.lb-rank.gold { background: rgba(251,191,36,0.15); color: var(--gold); }
.lb-rank.silver { background: rgba(148,163,184,0.15); color: #94a3b8; }
.lb-rank.bronze { background: rgba(180,83,9,0.15); color: #b45309; }
.lb-rank.normal { background: rgba(59,130,246,0.1); color: var(--accent); }
.lb-name { flex: 1; font-weight: 600; font-size: 14px; }
.lb-pts { font-weight: 800; font-size: 18px; color: var(--purple); }
.lb-pts-label { font-size: 11px; color: var(--muted); }

/* Ticket stats */
.ticket-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.ticket-stat { flex: 1; min-width: 100px; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.1); border-radius: 10px; padding: 12px; text-align: center; }
.ticket-stat .num { font-size: 22px; font-weight: 700; }
.ticket-stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* Add form */
.add-form { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.add-form.active { display: block; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.form-row input, .form-row select { flex: 1; min-width: 120px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
.form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); }
.btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
.btn:hover { opacity: 0.9; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-danger { background: var(--red); }

/* Toggle button */
.toggle-add { margin-top: 12px; }

/* Empty state */
.empty { text-align: center; color: var(--muted); padding: 20px; font-size: 14px; }

/* Footer */
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="flag">🇺🇸</div>
    <h1>Veterans 5K Fundraising Tracker</h1>
    <div class="subtitle">Park City High School • Club America / TPUSA</div>
  </div>

  <!-- Total Raised -->
  <div class="total-card">
    <div class="label">Total Raised</div>
    <div class="amount" id="total-amount">$0</div>
    <div class="breakdown">
      <div class="breakdown-item">
        <div class="num" id="donation-total">$0</div>
        <div class="lbl">Donations</div>
      </div>
      <div class="breakdown-item">
        <div class="num" id="ticket-sales">$0</div>
        <div class="lbl">Ticket Sales</div>
      </div>
      <div class="breakdown-item">
        <div class="num" id="ticket-count">0</div>
        <div class="lbl">Tickets Sold</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width: 0%"></div></div>
      <div class="progress-labels">
        <span>$0</span>
        <span id="goal-label">$15,000 goal</span>
      </div>
    </div>
  </div>

  <div class="grid">
    <!-- Leaderboard -->
    <div class="card">
      <h2>🏆 Referral Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>

    <!-- Tickets -->
    <div class="card">
      <h2>🎟️ Tickets</h2>
      <div class="ticket-stats">
        <div class="ticket-stat"><div class="num" id="ts-count">0</div><div class="lbl">Sold</div></div>
        <div class="ticket-stat"><div class="num" id="ts-revenue">$0</div><div class="lbl">Revenue</div></div>
      </div>
      <div id="ticket-list"></div>
    </div>
  </div>

  <!-- Donations -->
  <div class="card" style="margin-bottom: 24px;">
    <h2>💰 Total Donations</h2>
    <div style="text-align: center; padding: 20px;">
      <div style="font-size: 36px; font-weight: 800; color: var(--green);" id="donation-total-display">$0</div>
      <div style="color: var(--muted); font-size: 13px; margin-top: 4px;" id="donation-count-display">0 donors</div>
    </div>
  </div>

  <div class="footer">
    Veterans 5K • Nov 7, 2026 • Park City, UT
  </div>
</div>

<script>
const GOAL = 15000;
const TICKET_PRICE = 44;

// Default data
const DEFAULT_DATA = {
  donations: [
    {name: "Outside Organization", date: "2026-10-01", amount: 8000},
    {name: "Blake Sawyer", date: "2026-09-11", amount: 1000},
    {name: "Allison & Jimmy May", date: "2026-09-25", amount: 500},
    {name: "Thomas Birsic", date: "2026-10-08", amount: 200},
    {name: "Catherine & Alex Cimos", date: "2026-10-10", amount: 100},
    {name: "Robyn Veal", date: "2026-09-28", amount: 100},
    {name: "Jeffrey Pierce", date: "2026-09-27", amount: 100},
    {name: "Jaime Shrayber", date: "2026-10-14", amount: 100},
    {name: "Melanie Monestere", date: "2026-10-07", amount: 150},
    {name: "Chris Summers", date: "2026-10-11", amount: 50},
    {name: "Erin Thomas", date: "2026-10-10", amount: 50},
    {name: "Patty Brewer", date: "2026-10-07", amount: 50},
    {name: "Oliver Abbett", date: "2026-10-07", amount: 25},
    {name: "Luca Kehr", date: "2026-10-06", amount: 25},
    {name: "Megan Newberry", date: "2026-10-05", amount: 25},
    {name: "Sara Steinberger", date: "2026-10-04", amount: 25},
    {name: "Finley Thomas", date: "2026-09-19", amount: 25},
  ],
  tickets: [
    {source: "Bloomerang Registrations", qty: 36, amount: 1585, date: "2026-10-21", registrants: [
      "Jaime Shrayber", "Chris Summers", "Blake Sawyer", "Catherine & Alex Cimos", "Erin Thomas",
      "Thomas Birsic", "Oliver Abbett", "Melanie Monestere", "Patty Brewer", "Luca Kehr",
      "Megan Newberry", "Sara Steinberger", "Robyn Veal", "Jeffrey Pierce", "Allison & Jimmy May",
      "Finley Thomas", "Andrew Perillo", "Sosie Sheffert", "Ely Shrayber", "Ledger Moffat",
      "Campbell Thomas", "Derek Eddy", "Hudson Fossey", "Will Haladin", "Max Flachsmann",
      "Dane Hays", "Jacob Kindt", "Ben Carter", "Gavin Russell", "Urijah Mendez",
      "Chris Donovan", "Katie Fry", "Lora Watts", "Estrellita Hoffmann", "The Nimocks",
      "Mrs. Kennedy"
    ]},
  ],
  leaderboard: [
    {name: "Ely Shrayber", points: 7},
    {name: "Sosie Sheffert", points: 7},
    {name: "Andrew Perillo", points: 5},
    {name: "Ledger Moffat", points: 4},
    {name: "Campbell Thomas", points: 1},
  ],
};

let data = DEFAULT_DATA;

function fmt(n) { return '$' + n.toLocaleString(); }

function render() {
  // Totals
  const donationTotal = data.donations.reduce((s, d) => s + d.amount, 0);
  const ticketTotal = data.tickets.reduce((s, t) => s + t.amount, 0);
  const ticketCount = data.tickets.reduce((s, t) => s + t.qty, 0);
  const grandTotal = donationTotal + ticketTotal;

  document.getElementById('total-amount').textContent = fmt(grandTotal);
  document.getElementById('ts-count').textContent = ticketCount;
  document.getElementById('ts-revenue').textContent = fmt(ticketTotal);

  // Progress
  const pct = Math.min(100, (grandTotal / GOAL) * 100);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('goal-label').textContent = fmt(grandTotal) + ' / ' + fmt(GOAL) + ' goal';

  // Leaderboard
  const lb = document.getElementById('leaderboard');
  const sorted = [...data.leaderboard].sort((a, b) => b.points - a.points);
  if (sorted.length === 0) { lb.innerHTML = '<div class="empty">No referrals yet</div>'; }
  else {
    lb.innerHTML = sorted.map((entry, i) => {
      const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
      return `<div class="lb-row">
        <div class="lb-rank ${rankClass}">${i + 1}</div>
        <div class="lb-name">${entry.name}</div>
        <div class="lb-pts">${entry.points}<span class="lb-pts-label"> pts</span></div>
      </div>`;
    }).join('');
  }

  // Donations total
  document.getElementById('donation-total-display').textContent = fmt(donationTotal);
  document.getElementById('donation-count-display').textContent = data.donations.length + ' donors';

  // Tickets - show registrant names only
  const tl = document.getElementById('ticket-list');
  const allRegistrants = data.tickets.flatMap(t => t.registrants || []);
  if (allRegistrants.length === 0) {
    tl.innerHTML = '<div class="empty" style="margin-top: 12px;">36 runners registered</div>';
  } else {
    tl.innerHTML = '<div style="margin-top: 16px;"><div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Registered Runners (' + allRegistrants.length + ')</div><div style="display: flex; flex-wrap: wrap; gap: 6px;">' +
      allRegistrants.map(name => `<span style="background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.1); border-radius: 20px; padding: 4px 12px; font-size: 13px;">${name}</span>`).join('') +
      '</div></div>';
  }
}

render();
</script>
</body>
</html>
